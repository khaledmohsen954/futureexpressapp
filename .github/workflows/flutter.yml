name: Flutter UI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform runners
        run: flutter create --platforms=android,ios,web .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze source
        run: flutter analyze
      - name: Build web preview
        run: flutter build web
