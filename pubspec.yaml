name: futureexpressapp
description: Future Express courier and shipment management app.
publish_to: none
version: 1.0.4+5

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.3.2
  shared_preferences: ^2.5.5
  cached_network_image: ^3.3.1
  loading_animation_widget: ^1.2.1
  shimmer_animation: ^2.2.1
  gap: ^3.0.1
  dio: ^5.4.3+1
  get_it: ^8.0.1
  flutter_bloc: ^9.1.1
  internet_connection_checker_plus: ^2.5.2
  flutter_screenutil: ^5.9.3
  equatable: ^2.0.5
  bloc: ^9.0.0
  http: ^1.2.1
  http_parser: ^4.0.2
  easy_localization: ^3.0.7

  dartz: ^0.10.1
  country_picker: ^2.0.27
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  photo_view: ^0.15.0
  pinput: ^5.0.0
  flutter_svg: ^2.2.0
  bot_toast: ^4.1.3
  intl: ^0.20.2
  smooth_page_indicator: ^1.2.1
  custom_timer: ^0.2.3
  flutter_lints: ^6.0.0
  collection: ^1.19.1
  timeago: ^3.7.1
  lottie: ^3.3.1
  mobile_scanner: ^7.0.1
  pretty_qr_code: ^3.5.0
  camera: ^0.11.2
  image: ^4.2.0
  rename: ^3.1.0
  file_picker: ^10.0.0
  image_picker: ^1.1.2
  flutter_html: ^3.0.0
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1
  path_provider: ^2.1.4
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1


  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/png/fexLogo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/auth/future_express_logo.png
    - assets/png/
    - assets/svg/
    - assets/global_icon/
