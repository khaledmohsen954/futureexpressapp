name: futureexpressapp
description: Future Express courier interface based on the Figma design.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.3.2
  shared_preferences: ^2.5.5
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/png/fexLogo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/auth/future_express_logo.png
    - assets/png/

